<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkour Game - Enhanced</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial; }
        canvas { display: block; background: linear-gradient(to bottom, #87CEEB, #E0F6FF); }
        #ui { position: absolute; top: 10px; left: 10px; color: #333; font-size: 14px; }
    </style>
</head>
<body>
    <div id="ui">
        <div>Speed: <span id="speed">0</span></div>
        <div>Height: <span id="height">0</span></div>
        <div>Action: <span id="action">None</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const GRAVITY = 0.6;
        const MOVE_SPEED = 8;
        const JUMP_POWER = 15;
        const FLIP_DURATION = 30;

        let gameState = {
            score: 0,
            cameraX: 0
        };

        let player = {
            x: 100,
            y: canvas.height - 150,
            width: 40,
            height: 50,
            dx: 0,
            dy: 0,
            jumping: false,
            onGround: false,
            flipType: '',
            flipProgress: 0,
            flipping: false,
            rotation: 0,
            velocityX: 0,
            velocityY: 0,
            frameCount: 0,
            animationFrame: 0,
            direction: 1, // 1 for right, -1 for left
            getHitbox: function() {
                return {
                    x: this.x,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }
        };

        let terrain = [];
        let keys = {};

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        document.addEventListener('keydown', (event) => {
            keys[event.key] = true;
            
            if (event.key === 'ArrowUp' && player.onGround && !player.flipping) {
                player.dy = -JUMP_POWER;
                player.jumping = true;
                player.onGround = false;
            }
            
            if (['b', 'f', 'g', 'v'].includes(event.key) && player.jumping && !player.flipping) {
                startFlip(event.key);
            }
        });

        document.addEventListener('keyup', (event) => {
            keys[event.key] = false;
        });

        function startFlip(type) {
            player.flipping = true;
            player.flipType = type;
            player.flipProgress = 0;
            
            document.getElementById('action').textContent = getFlipName(type);
        }

        function getFlipName(type) {
            const flips = { 'b': 'Back Flip', 'f': 'Front Flip', 'g': 'Gainer', 'v': 'Vault' };
            return flips[type] || 'None';
        }

        function updateFlip() {
            if (player.flipping) {
                player.flipProgress++;
                
                if (player.flipType === 'b') {
                    player.rotation -= (Math.PI * 2) / FLIP_DURATION; // Full rotation backwards
                } else if (player.flipType === 'f') {
                    player.rotation += (Math.PI * 2) / FLIP_DURATION; // Full rotation forwards
                } else if (player.flipType === 'g') {
                    player.rotation += (Math.PI * 2.5) / FLIP_DURATION; // 1.25 rotations
                    player.dy -= 0.3; // Extra height
                } else if (player.flipType === 'v') {
                    player.rotation += (Math.PI) / FLIP_DURATION; // Half rotation with momentum
                    player.dx += player.direction * 1.5;
                }
                
                if (player.flipProgress >= FLIP_DURATION) {
                    player.flipping = false;
                    player.flipType = '';
                    player.rotation = 0;
                }
            }
        }

        function updateMovement() {
            // Horizontal movement with momentum
            if (keys['ArrowLeft']) {
                player.dx = -MOVE_SPEED;
                player.direction = -1;
            } else if (keys['ArrowRight']) {
                player.dx = MOVE_SPEED;
                player.direction = 1;
            } else {
                player.dx *= 0.85; // Friction
            }

            player.x += player.dx;
            player.velocityX = player.dx;

            // Vertical movement with gravity
            player.dy += GRAVITY;
            player.y += player.dy;
            player.velocityY = player.dy;

            // Screen wrapping
            if (player.x < -50) player.x = canvas.width;
            if (player.x > canvas.width + 50) player.x = -50;

            // Camera follow
            gameState.cameraX = player.x - canvas.width / 4;
        }

        function checkCollisions() {
            let hitbox = player.getHitbox();
            player.onGround = false;
            player.jumping = false;

            terrain.forEach((t) => {
                if (checkAABBCollision(hitbox, t.getHitbox())) {
                    // Landing on terrain from above
                    if (player.dy > 0 && player.y + player.height - player.dy <= t.y + 10) {
                        player.y = t.y - player.height;
                        player.dy = 0;
                        player.onGround = true;
                        player.flipping = false;
                        player.rotation = 0;
                    }
                    // Hit head from below
                    else if (player.dy < 0) {
                        player.dy = 0;
                    }
                }
            });

            // Death condition
            if (player.y > canvas.height + 100) {
                resetGame();
            }
        }

        function checkAABBCollision(box1, box2) {
            return box1.x < box2.x + box2.width &&
                   box1.x + box1.width > box2.x &&
                   box1.y < box2.y + box2.height &&
                   box1.y + box1.height > box2.y;
        }

        function generateTerrain() {
            let lastTerrain = terrain[terrain.length - 1];
            let lastX = lastTerrain ? lastTerrain.x + lastTerrain.width : canvas.width;
            let gap = Math.random() * 80 + 60;
            let height = Math.random() * 60 + 40;
            let width = Math.random() * 100 + 80;
            
            terrain.push(new Platform(lastX + gap, canvas.height - height, width, height));
        }

        class Platform {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = `hsl(${Math.random() * 60 + 80}, 70%, 50%)`;
            }

            getHitbox() {
                return { x: this.x, y: this.y, width: this.width, height: this.height };
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - gameState.cameraX, this.y, this.width, this.height);
                
                // Hitbox visualization (debug)
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1;
                ctx.strokeRect(this.x - gameState.cameraX, this.y, this.width, this.height);
            }
        }

        function drawPlayer() {
            ctx.save();
            
            let screenX = player.x - gameState.cameraX;
            let screenY = player.y;

            ctx.translate(screenX + player.width / 2, screenY + player.height / 2);
            
            if (player.rotation !== 0) {
                ctx.rotate(player.rotation);
            }

            // Draw character body
            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);

            // Draw eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(-10, -15, 8, 8);
            ctx.fillRect(5, -15, 8, 8);

            ctx.fillStyle = 'black';
            ctx.fillRect(-8, -13, 4, 4);
            ctx.fillRect(7, -13, 4, 4);

            // Draw mouth based on action
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            if (player.flipping) {
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI);
                ctx.stroke();
            } else {
                ctx.fillStyle = 'black';
                ctx.fillRect(-4, 5, 8, 2);
            }

            // Draw action indicator
            if (player.flipping) {
                ctx.fillStyle = 'rgba(255, 255, 0, 0.7)';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(getFlipName(player.flipType), 0, -35);
            }

            // Hitbox visualization
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
            ctx.lineWidth = 2;
            ctx.strokeRect(-player.width / 2, -player.height / 2, player.width, player.height);

            ctx.restore();
        }

        function resetGame() {
            player.x = 100;
            player.y = canvas.height - 150;
            player.dx = 0;
            player.dy = 0;
            player.rotation = 0;
            player.flipping = false;
            gameState.score = 0;
            terrain = [];
            for (let i = 0; i < 5; i++) generateTerrain();
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updateMovement();
            updateFlip();
            checkCollisions();

            // Generate new terrain
            while (terrain.length === 0 || terrain[terrain.length - 1].x - gameState.cameraX < canvas.width) {
                generateTerrain();
            }

            // Remove off-screen terrain
            terrain = terrain.filter(t => t.x - gameState.cameraX > -200);

            // Draw terrain
            terrain.forEach(t => t.draw());

            // Draw player
            drawPlayer();

            // Update UI
            document.getElementById('speed').textContent = Math.abs(player.dx).toFixed(1);
            document.getElementById('height').textContent = (canvas.height - player.y).toFixed(0);
            document.getElementById('action').textContent = player.flipping ? getFlipName(player.flipType) : 'None';

            gameState.score++;

            requestAnimationFrame(update);
        }

        resetGame();
        update();
    </script>
</body>
</html>
